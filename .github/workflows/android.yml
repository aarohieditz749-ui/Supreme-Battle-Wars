
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract game ZIP
        run: |
          unzip -q Aarohi_Supreme_Duelist_New_Project.zip -d extracted

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supreme-Battle-Wars-APK
          path: extracted/**/build/outputs/apk/**/*.apk
